[package]
name = "fasta_windows"
version = "0.3.0"
authors = ["Max Brown <mb39@sanger.ac.uk>", "Matthieu Muffato", "Rich Challis"]
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Make quick statistics in windows from a fasta file."
homepage = "https://github.com/tolkit/fasta_windows"
repository = "https://github.com/tolkit/fasta_windows"
documentation = "https://github.com/tolkit/fasta_windows"
keywords = ["fasta", "windows", "genomics"]
categories = ["command-line-utilities", "science"]

[features]
default = ["entropy"]
# -e/--entropy mode
entropy = []
# bzip2, xz and zstd input (gzip is always supported); builds C libraries
compression = ["needletail/compression"]

[dependencies]
clap = {version = "4.5.47", features = ["cargo"]}
rayon = "1.11.0"
indicatif = "0.18.0"
anyhow = "1.0.99"
needletail = { version = "0.7.3", default-features = false, features = ["flate2"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
